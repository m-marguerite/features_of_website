<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualisation Récursion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Visualisation de Range of Numbers Generator</h1>
    <p>Comprendre la récursion de manière ludique</p>
  </header>

  <main>
    <div class="controls">
      <input type="number" id="startNum" placeholder="Start Num" min="0">
      <input type="number" id="endNum" placeholder="End Num" min="0">
      <button id="generateBtn">Générer le tableau</button>
    </div>

    <div id="resultContainer" class="result-container">
      <!-- Les nombres seront affichés ici -->
    </div>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
